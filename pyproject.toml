[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cheta"
version = "0.1.0"
description = "On-device face and voice recognition, memory and forgetting for Reachy Mini apps."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Eze Ransom" }]
keywords = [
    "reachy-mini",
    "robotics",
    "face-recognition",
    "speaker-recognition",
    "on-device",
    "privacy",
    "memory",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Typing :: Typed",
]
dependencies = [
    "cryptography>=50.0.2",
    "huggingface-hub>=0.24",
    "keyring>=25.7.0",
    "numpy>=2.2.6",
    "onnxruntime>=1.20,<1.24; python_version < '3.11'",  # 1.24+ has no Python 3.10 wheels
    "onnxruntime>=1.20; python_version >= '3.11'",
    "opencv-python>=5.1.0.95",
    "sentence-transformers>=6.3.0",
    "sounddevice>=0.5.6",
    "speechbrain>=1.1.2",
]

[project.urls]
Homepage = "https://github.com/Ransom070400/cheta"
Repository = "https://github.com/Ransom070400/cheta"
Issues = "https://github.com/Ransom070400/cheta/issues"
Changelog = "https://github.com/Ransom070400/cheta/blob/main/CHANGELOG.md"

[project.scripts]
cheta = "cheta.cli:main"

[project.optional-dependencies]
robot = ["reachy-mini>=1.14; python_version >= '3.11'"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[tool.hatch.build.targets.wheel]
packages = ["cheta"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: tests that download models (deselected by default)"]
addopts = "-m 'not network'"

[[tool.mypy.overrides]]
module = ["sentence_transformers", "onnxruntime", "sounddevice", "speechbrain.*", "torch", "reachy_mini"]
ignore_missing_imports = true

# reachy-mini needs PyGObject only on Linux, but uv resolves every platform at once and would try
# to compile it (and pycairo) from source on any machine. Static metadata avoids the build.
[[tool.uv.dependency-metadata]]
name = "pygobject"
requires-dist = ["pycairo>=1.16"]

[[tool.uv.dependency-metadata]]
name = "pycairo"
requires-dist = []
